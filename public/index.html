<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tela Live</title><link rel="stylesheet" href="style.css"></head><body>
<div id="auth" class="auth"><div class="authCard"><div class="brand">◉ <b>Tela Live</b></div><h1>Entre na central</h1><p>Salas, transmissão e voz.</p><input id="user" placeholder="Usuário"><input id="pass" type="password" placeholder="Senha"><div class="row"><button id="login" class="primary">Entrar</button><button id="register">Criar conta</button></div><small id="authMsg"></small></div></div>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand">◉ <b>Tela Live</b></div><button id="newRoom" class="primary wide">＋ Nova sala</button><h4>SALAS</h4><div id="roomList"></div><div class="profile"><span id="profileName"></span><button id="logout">Sair</button></div></aside>
<main class="main"><header><div><h2 id="title">Selecione uma sala</h2><small id="subtitle">Crie ou entre em uma transmissão</small></div><div class="headerBtns"><button id="invite">🔗 Convite</button><button id="broadcast" class="primary">🖥️ Transmitir</button></div></header>
<section id="welcome" class="welcome"><div class="orb">◉</div><h1>Sua central de transmissão</h1><p>Crie uma sala e chame seus amigos.</p></section>
<section id="roomView" class="roomView hidden"><div class="stage"><div id="streamsGrid"><video id="video" class="localPreview" autoplay muted playsinline></video></div><div id="empty">🎥<br><b>Ninguém está transmitindo</b><br><small>A transmissão aparecerá aqui.</small></div><div id="liveBadge" class="live hidden">● AO VIVO</div></div>
<div class="streamControls"><label>Qualidade <select id="quality"><option value="1280:720:30:2500000">720p 30 FPS • 2.5 Mbps</option><option value="1280:720:60:4500000">720p 60 FPS • 4.5 Mbps</option><option value="1920:1080:30:5000000">1080p 30 FPS • 5 Mbps</option><option value="1920:1080:60:8000000" selected>1080p 60 FPS • 8 Mbps</option><option value="2560:1440:30:9000000">1440p 30 FPS • 9 Mbps</option><option value="2560:1440:60:14000000">1440p 60 FPS • 14 Mbps</option><option value="3840:2160:30:16000000">4K 30 FPS • 16 Mbps</option><option value="3840:2160:60:24000000">4K 60 FPS • 24 Mbps</option></select></label><button id="mic">🎤 Microfone</button><button id="deafen">🎧 Surdo</button><button id="stop" class="danger hidden">⏹ Encerrar</button></div></section></main>
<aside class="members"><h3>MEMBROS <span id="memberCount"></span></h3><div id="members"></div><div class="chat"><h3>CHAT</h3><div id="messages"></div><div class="chatInput"><input id="message" placeholder="Conversar..."><button id="send">➤</button></div></div></aside></div>
<div id="modal" class="modal hidden"><div class="modalCard"><button id="closeModal" class="x">×</button><h2>Nova sala</h2><input id="newRoomName" placeholder="Nome da sala"><label class="check"><input type="checkbox" id="private"> Sala privada</label><input id="roomPassword" placeholder="Código da sala" class="hidden"><button id="createRoom" class="primary wide">Criar sala</button></div></div><script src="app.js"></script></body></html>
